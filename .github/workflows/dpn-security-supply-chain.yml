name: DPN Security & Supply Chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpn-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history
        shell: bash
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks git --no-banner --redact --log-opts="--all" .

  repository-integrity:
    name: FiveM repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject committed secrets and generated release payloads
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -Ei '(^|/)(\.env($|\.)|server\.cfg$|.*\.(pem|p12|pfx|key)$|id_rsa|credentials?\.json$|secrets?\.json$|.*\.zip$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Sensitive/generated files must not be committed:"
            echo "$bad"
            exit 1
          fi
      - name: Validate all FiveM manifests and Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          python3 tools/check_fivem_manifest_integrity.py
          python3 tools/check_fivem_lua_syntax.py
      - name: Validate workflow supply-chain policy
        shell: python
        run: |
          import pathlib,re,sys
          problems=[]
          for p in pathlib.Path(".github/workflows").glob("*.yml"):
              text=p.read_text(encoding="utf-8")
              for n,line in enumerate(text.splitlines(),1):
                  if not re.match(r"^\s*-?\s*uses:\s*", line): continue
                  m=re.match(r"^\s*-?\s*uses:\s*([^\s#]+)",line)
                  if not m: continue
                  ref=m.group(1)
                  if ref.startswith("./"): continue
                  if "@" not in ref or not re.search(r"@[0-9a-fA-F]{40}$",ref):
                      problems.append(f"{p}:{n}: action is not pinned to a full commit SHA: {ref}")
          if problems:
              print("\n".join(problems),file=sys.stderr)
              raise SystemExit(1)
          print("All external Actions are pinned to immutable commit SHAs.")
