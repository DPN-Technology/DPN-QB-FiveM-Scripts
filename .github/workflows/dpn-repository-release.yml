name: DPN Repository Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/dpn-repository-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish DPN repository baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid repository VERSION: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify DPN repository
        run: python3 tools/dpn_repo_validator.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          gh release create "$TAG"             --target "$GITHUB_SHA"             --title "DPN FiveM Script Library v$VERSION"             --generate-notes             --notes "Official DPN Technology FiveM Script Library repository baseline.

This release represents the tested repository baseline documented in docs/RELEASE_PROFILE.md.

Created by Diesel, CEO of DPN Technology.

DPN Technology — Develop • Pioneer • Navigate."
