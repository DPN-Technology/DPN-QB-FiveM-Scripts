name: DPN DEBUG Lua Syntax unes-main

on:
  push:
    branches:
      - refactor/fivem-runtime-hardening-v1

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Parse target
        env:
          TARGET: "qbcore/public-safety/dpn-unified-emergency-services-suite/core/dpn-unified-emergency-network/server/main.lua"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          target = Path(os.environ['TARGET'])
          source = target.read_text(encoding='utf-8')
          normalized = source.replace(chr(96), '0')
          out = Path('/tmp/check.lua')
          out.write_text(normalized, encoding='utf-8')
          result = subprocess.run(['luac5.4', '-p', str(out)], capture_output=True, text=True)
          if result.returncode:
              print(result.stderr or result.stdout)
              raise SystemExit(result.returncode)
          print(f'PASS: {target}')
          PY
