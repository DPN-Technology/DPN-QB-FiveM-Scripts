name: DPN Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dpn-quality-gate:
    name: Validate DPN Resource Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Python tooling syntax
        run: python3 -m compileall -q tools

      - name: Run DPN repository validator
        run: python3 tools/dpn_repo_validator.py

      - name: Audit resource hardening posture
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_resource_hardening.py \
            --top 15 \
            --markdown /tmp/dpn-resource-hardening.md \
            --json /tmp/dpn-resource-hardening.json
          cat /tmp/dpn-resource-hardening.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hardening audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dpn-resource-hardening-audit
          path: |
            /tmp/dpn-resource-hardening.md
            /tmp/dpn-resource-hardening.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate hardening wave 1 controls
        run: python3 tools/check_hardening_wave1.py

      - name: Validate hardening wave 2 controls
        run: python3 tools/check_hardening_wave2.py

      - name: Dry-run Release Factory v2
        shell: bash
        run: |
          set -euo pipefail
          resource="qbcore/law-enforcement/dpn-starchase"
          archive="$(python3 tools/package_resource.py "$resource")"
          python3 -m zipfile -t "$archive"
          checksum="$archive.sha256"
          sha256sum "$archive" > "$checksum"
          sha256sum -c "$checksum"
          evidence="dist/dpn-starchase-v1.1.1.release-evidence.json"
          python3 tools/generate_release_evidence.py "$resource" "$archive" "$checksum" --output "$evidence"
          test -s "$evidence"

      - name: Validate FiveM manifest integrity
        run: python3 tools/check_fivem_manifest_integrity.py

      - name: Validate medical registry ownership
        run: python3 tools/check_medical_registry_ownership.py

      - name: Validate MIB loadout authorization
        run: python3 tools/check_mib_loadout_authorization.py

      - name: Validate MIB target proximity authority
        run: python3 tools/check_mib_target_proximity_authority.py

      - name: Validate PD doorbell cooldown authority
        run: python3 tools/check_pd_doorbell_cooldown_authority.py

      - name: Validate emergency correlation contract
        run: python3 tools/check_emergency_correlation_contract.py

      - name: Validate dispatch correlation and deduplication
        run: python3 tools/check_dispatch_correlation_dedup.py

      - name: Validate MDT correlation integration
        run: python3 tools/check_mdt_correlation_integration.py

      - name: Validate Medical Core authority
        run: python3 tools/check_medical_core_authority.py

      - name: Validate Medical Dispatch authority
        run: python3 tools/check_medical_dispatch_authority.py

      - name: Validate Medical Dispatch bounded deduplication
        run: python3 tools/check_medical_dispatch_dedup.py

      - name: Validate Medical responder lifecycle authority
        run: python3 tools/check_medical_responder_lifecycle_authority.py

      - name: Validate Medical responder runtime guard
        run: python3 tools/check_medical_responder_runtime_guard.py

      - name: Validate hospital staff admission proximity authority
        run: python3 tools/check_hospital_admission_distance_authority.py

      - name: Validate hospital self-check-in proximity authority
        run: python3 tools/check_hospital_selfcheckin_distance_authority.py

      - name: Validate Phase 3G emergency network ownership
        run: python3 tools/check_emergency_network_ownership.py

      - name: Validate Phase 3G medical dispatch compatibility routing
        run: python3 tools/check_medical_dispatch_compat_single_route.py

      - name: Validate Phase 3G v13 medical dispatch compatibility routing
        run: python3 tools/check_medical_dispatch_v13_single_route.py

      - name: Validate Phase 3G v9 medical dispatch compatibility routing
        run: python3 tools/check_medical_dispatch_v9_single_route.py

      - name: Validate Phase 3G v10 medical dispatch compatibility routing
        run: python3 tools/check_medical_dispatch_v10_single_route.py

      - name: Validate Phase 3G v11 medical dispatch compatibility routing
        run: python3 tools/check_medical_dispatch_v11_single_route.py

      - name: Validate Phase 3G v12 medical dispatch compatibility routing
        run: python3 tools/check_medical_dispatch_v12_single_route.py

      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Validate FiveM Lua syntax
        run: python3 tools/check_fivem_lua_syntax.py
