name: DPN Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dpn-quality-gate:
    name: Validate DPN Resource Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run DPN repository validator
        run: python3 tools/dpn_repo_validator.py
