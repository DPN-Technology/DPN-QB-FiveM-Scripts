name: DPN Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dpn-quality-gate:
    name: Validate DPN Resource Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run DPN repository validator
        run: python3 tools/dpn_repo_validator.py

      - name: Audit FiveM manifest integrity
        run: |
          python3 tools/audit_fxmanifest_integrity.py --json > fxmanifest-integrity-audit.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('fxmanifest-integrity-audit.json').read_text(encoding='utf-8'))
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          lines = [
              '## DPN FiveM Manifest Integrity Audit',
              '',
              f"- Manifests scanned: **{report.get('manifestsScanned', 0)}**",
              f"- Local/external references scanned: **{report.get('referencesScanned', 0)}**",
              f"- Missing local references observed: **{report.get('missingReferenceCount', 0)}**",
              f"- External resource references observed: **{report.get('externalReferenceCount', 0)}**",
              '',
              '> This stage is audit-only until existing findings are reviewed and a deliberate regression baseline is approved. It does not weaken the repository validator or Lua syntax checks.',
              '',
          ]
          missing = report.get('missingReferences', [])
          if missing:
              lines.append('### Missing local references observed')
              lines.append('')
              for item in missing[:50]:
                  lines.append(f"- `{item.get('manifest')}`: `{item.get('directive')}` -> `{item.get('reference')}`")
              if len(missing) > 50:
                  lines.append(f"- ...and {len(missing) - 50} additional finding(s).")
              lines.append('')
          with summary.open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines))
          PY

      - name: Audit emergency command and event surface
        run: |
          python3 tools/audit_emergency_surface.py \
            --baseline tools/emergency-surface-baseline.json \
            --fail-on-regression
          python3 tools/audit_emergency_surface.py \
            --baseline tools/emergency-surface-baseline.json \
            --json > emergency-surface-audit.json
          python3 tools/check_emergency_correlation_readiness.py \
            --audit emergency-surface-audit.json \
            --baseline tools/emergency-correlation-readiness-baseline.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('emergency-surface-audit.json').read_text(encoding='utf-8'))
          baseline = json.loads(Path('tools/emergency-correlation-readiness-baseline.json').read_text(encoding='utf-8'))
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          readiness = report.get('correlationReadiness', {})
          reviewed = baseline.get('resources', {})
          ready = sum(1 for fields in readiness.values() if 'eventId' in fields)
          reviewed_ready = sum(1 for fields in reviewed.values() if 'eventId' in fields)
          readiness_improvements = sum(
              len(set(fields) - set(reviewed.get(resource, [])))
              for resource, fields in readiness.items()
          )
          comparison = report.get('baselineComparison', {})
          lines = [
              '## DPN Emergency Surface Audit',
              '',
              f"- Lua files scanned: **{report.get('luaFilesScanned', 0)}**",
              f"- Emergency declarations/usages: **{report.get('declarationsAndUsages', 0)}**",
              f"- Duplicate command names: **{report.get('duplicateCommandCount', 0)}**",
              f"- Duplicate-command regressions vs reviewed baseline: **{comparison.get('regressionCount', 0)}**",
              f"- Duplicate-command improvements vs reviewed baseline: **{comparison.get('improvementCount', 0)}**",
              f"- Resources with lexical `eventId` readiness: **{ready}/{len(readiness)}** (reviewed baseline: {reviewed_ready}/{len(reviewed)})",
              f"- New correlation-field observations vs readiness baseline: **{readiness_improvements}**",
              '',
              '> CI blocks duplicate-command ownership expansion and loss of previously reviewed correlation-field readiness. New correlation fields are treated as forward progress and do not auto-rewrite either baseline.',
              '',
          ]
          with summary.open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines))
          PY

      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Validate FiveM Lua syntax
        run: python3 tools/check_fivem_lua_syntax.py
