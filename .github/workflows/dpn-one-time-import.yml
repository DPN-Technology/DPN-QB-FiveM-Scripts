name: DPN One-Time Resource Import

on:
  push:
    branches:
      - import/dpn-resource-bundle-2026-08-31
  workflow_dispatch:

concurrency:
  group: dpn-resource-import
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for complete import bundle
        id: ready
        shell: bash
        run: |
          if [ -s "_import_xz/archive.b64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "DPN import archive is present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DPN import archive has not been staged yet."
          fi

      - name: Decode and install organized DPN resource bundle
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          base64 -d _import_xz/archive.b64 > /tmp/dpn-resource-import.tar.xz
          tar -tJf /tmp/dpn-resource-import.tar.xz >/dev/null
          tar -xJf /tmp/dpn-resource-import.tar.xz -C .
          rm -rf _import _import_xz
          rm -f .github/workflows/dpn-one-time-import.yml

      - name: Commit organized resources
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "DPN Technology Import Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "resources: import and organize DPN FiveM script library"
          git push
