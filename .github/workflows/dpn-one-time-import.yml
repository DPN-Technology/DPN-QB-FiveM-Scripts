name: DPN One-Time Resource Import

on:
  push:
    branches:
      - import/dpn-resource-bundle-2026-08-31
  workflow_dispatch:

concurrency:
  group: dpn-resource-import
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for complete import bundle
        id: ready
        shell: bash
        run: |
          expected=56
          actual=$(find _import -maxdepth 1 -type f -name 'chunk_*' 2>/dev/null | wc -l)
          echo "Found $actual of $expected import chunks."
          if [ "$actual" -ne "$expected" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode and install organized DPN resource bundle
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          cat _import/chunk_* | base64 -d > /tmp/dpn-resource-import.tar.gz
          tar -tzf /tmp/dpn-resource-import.tar.gz >/dev/null
          tar -xzf /tmp/dpn-resource-import.tar.gz -C .
          rm -rf _import
          rm -f .github/workflows/dpn-one-time-import.yml

      - name: Commit organized resources
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "DPN Technology Import Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "resources: import and organize DPN FiveM script library"
          git push
