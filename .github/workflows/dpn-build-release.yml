name: DPN Build & Release Resource

on:
  workflow_dispatch:
    inputs:
      resource_path:
        description: "Resource path, e.g. qbcore/law-enforcement/dpn-example"
        required: true
        type: string
      publish_release:
        description: "Create a GitHub Release after packaging"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate-package-release:
    name: Validate and Package DPN Resource
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate DPN repository
        run: python3 tools/dpn_repo_validator.py

      - name: Package requested DPN resource
        id: package
        shell: bash
        run: |
          archive="$(python3 tools/package_resource.py "${{ inputs.resource_path }}")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Read DPN resource metadata
        id: metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          p = pathlib.Path("${{ inputs.resource_path }}") / "resource.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"name={data['name']}\n")
              f.write(f"version={data['version']}\n")
              f.write(f"display_name={data.get('display_name', data['name'])}\n")
              f.write(f"description={data.get('description', '')}\n")
          PY

      - name: Upload packaged resource
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.name }}-v${{ steps.metadata.outputs.version }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.name }}-v${{ steps.metadata.outputs.version }}
          TITLE: ${{ steps.metadata.outputs.display_name }} v${{ steps.metadata.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          DESCRIPTION: ${{ steps.metadata.outputs.description }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists."
            exit 1
          fi
          gh release create "$TAG" "$ARCHIVE"             --title "$TITLE"             --notes "Official DPN Technology FiveM resource release.

          $DESCRIPTION

          Created by Diesel, CEO of DPN Technology.

          Licensed under the repository DPN Technology Community Source License (DPN-CSL)."
