name: DPN Bug Report
description: Report a reproducible problem in a DPN Technology FiveM resource
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        # DPN Technology Bug Report
        DPN QB FiveM Scripts is created by Diesel, CEO of DPN Technology.
        Do not post passwords, tokens, private webhooks, license keys, or other secrets.
  - type: input
    id: resource
    attributes:
      label: DPN Resource
      placeholder: dpn-resource-name
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - QBCore
        - Standalone
        - Hybrid
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: FiveM artifact, QBCore, and important dependency versions
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Steps
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Remove all secrets before posting.
      render: shell
  - type: dropdown
    id: modified
    attributes:
      label: Is the resource modified?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the README and dependencies.
          required: true
        - label: I removed secrets/private information from this report.
          required: true
        - label: I tested the unmodified resource where practical.
          required: false
